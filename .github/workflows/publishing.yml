name: Publishing the action to the marketplace

on:   
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

permissions:
  contents: read
  #releases: write # not a valid scope, not sure what it needs then, so let's test without it

jobs:
  build: # make sure build/ci work properly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run all

  test-local-action:
    needs: build
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # execute the action locally for testing if anything breaks
      - uses: ./
        name: Load used actions
        with: 
          issue: 1
          team: rajbos
          owner: ${{ github.repository_owner }}
          repo: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Release with SBOM and attestations
    needs: test-local-action
    # Creates the GitHub release for this tag with the action files, a source archive and
    # SPDX/CycloneDX SBOMs attached, each with a verified artifact attestation.
    permissions:
      contents: write       # create the release and upload its assets
      id-token: write       # Sigstore keyless signing for the attestations
      attestations: write   # store the attestations
    uses: devops-actions/.github/.github/workflows/rw-release-attestation.yml@b88953c2b5ba6cfc3048a7fb6d32dc78e1588c58 # main

  notify:
    needs: release
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Show release result
        env:
          RESULT: ${{ needs.release.result }}
          URL: ${{ needs.release.outputs.release-url }}
        run: echo "Release $GITHUB_REF_NAME - $RESULT $URL"

      - uses: rajbos-actions/slack@ed1309ab9862e57e9e583e51c7889486b9a00b0f # v2.0.0
        with:
          status: ${{ needs.release.result }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
